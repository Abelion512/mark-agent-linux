<!doctype html>
<html data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <title>Mark Agent</title>
    <!--
      Content Security Policy
      - 'unsafe-eval' removed from script-src — React/Vite don't need it, and it blocks arbitrary eval().
        Monaco workers use blob: which is already allowed. Re-add only if a plugin explicitly needs eval()
        and only during dev builds via Vite HTML plugin.
      - connect-src * — intentional: renderer loads from file:// origin with webSecurity disabled,
        and users configure arbitrary AI provider endpoints (custom, Groq, Cerebras, localhost).
        Locking connect-src breaks those flows. Script injection prevention is enforced via
        script-src (no 'unsafe-inline' for scripts, no 'unsafe-eval').
      - style-src 'unsafe-inline' required for React, Tailwind, and DaisyUI runtime styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://* http://*; media-src 'self' data:; connect-src *;"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
