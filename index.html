<!doctype html>
<html lang="en" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <title>Mark Agent</title>
    <style>
      /* Linux WebKitGTK: cat background opaque sejak awal (anti transparan) */
      html,
      body {
        background: #0b0f0c !important;
      }
    </style>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://* http://*; media-src 'self' data:; connect-src *;"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
