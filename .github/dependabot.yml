# 📦 Dependabot config

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Jakarta'
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      electron:
        patterns:
          - 'electron'
          - 'electron-*'
          - '@electron-toolkit/*'
      react:
        patterns:
          - 'react'
          - 'react-*'
          - '@types/react*'
      dev:
        dependency-type: 'development'
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'vite'
          - '@vitejs/*'
    ignore:
      - dependency-name: 'electron'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'automated'
