name: One-off merge repair (linux)

# Sekali jalan: memperbaiki sisa kerusakan resolusi konflik merge PR #26 pada
# branch linux, verifikasi (vitest + vite build), lalu push perbaikan ke linux.
# Log dikirim ke komentar PR #29 dan ke .repair/repair.log di branch ini.

on:
  push:
    branches: ["chore/merge-repair-linux"]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    name: Repair + verify linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout linux
        uses: actions/checkout@v4
        with:
          ref: linux
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Patch + verify
        id: work
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a /tmp/repair.log) 2>&1
          echo "### import block BEFORE"
          sed -n '28,52p' src/hooks/agent/useMarkPlan.js
          python3 - <<'PY'
          import re, pathlib

          p = pathlib.Path("src/hooks/agent/useMarkPlan.js")
          s = p.read_text(encoding="utf-8")
          orig = s
          notes = []

          broken = "} from '../../api/trajectory'\n  classifyObjectiveKind,"
          fixed = "} from '../../api/trajectory'\nimport {\n  classifyObjectiveKind,"
          if broken in s:
              s = s.replace(broken, fixed, 1)
              notes.append("FIX1 ok - objectiveVerifier import statement restored")
          else:
              notes.append("FIX1 skip - broken import pattern not found")

          uses_lr = re.search(r"\blogReasoning\s*\(", s) is not None
          bound_lr = re.search(r"import\s*\{[^}]*\blogReasoning\b[^}]*\}\s*from", s) is not None
          local_lr = re.search(r"(?:const|let|var|function)\s+logReasoning\b", s) is not None
          if uses_lr and not bound_lr and not local_lr:
              anchor = "  logSubAgentSpawn as trajectoryLogSub\n} from '../../api/trajectory'"
              repl = "  logSubAgentSpawn as trajectoryLogSub,\n  logReasoning\n} from '../../api/trajectory'"
              if anchor in s:
                  s = s.replace(anchor, repl, 1)
                  notes.append("FIX2 ok - logReasoning imported from api/trajectory")
              else:
                  notes.append("FIX2 FAIL - trajectory import anchor not found")
          else:
              notes.append("FIX2 skip - uses=%s bound=%s local=%s" % (uses_lr, bound_lr, local_lr))

          s, n3 = re.subn(r"window\.api\.os_open\(\s*\{\s*url\s*\}\s*\)", "window.api.osOpen(url)", s)
          notes.append("FIX3 os_open -> osOpen count=%d" % n3)

          if s != orig:
              p.write_text(s, encoding="utf-8")
              notes.append("useMarkPlan.js written")
          else:
              notes.append("useMarkPlan.js unchanged")
          print("\n".join(notes))
          PY
          echo "### import block AFTER"
          sed -n '28,54p' src/hooks/agent/useMarkPlan.js
          echo "### conflict markers"
          git grep -I -n -E '^(<<<<<<< |>>>>>>> )' -- src src-tauri extension scripts tests evaluation || echo "none"
          echo "### versions"
          grep -m1 '"version"' package.json || true
          grep -m1 '"version"' src-tauri/tauri.conf.json || true
          grep -m1 '^version' src-tauri/Cargo.toml || true
          echo "### install"
          bun install --frozen-lockfile 2>&1 | tail -n 12
          echo "### vitest"
          set +e
          bunx vitest run 2>&1 | tail -n 45
          VT=${PIPESTATUS[0]}
          echo "vitest_exit=$VT"
          echo "### build"
          bun run build 2>&1 | tail -n 35
          BD=${PIPESTATUS[0]}
          echo "build_exit=$BD"
          set -e
          echo "### git status"
          git status --porcelain
          if [ "$VT" -ne 0 ] || [ "$BD" -ne 0 ]; then
            echo "VERIFY-FAILED"
            exit 1
          fi
          echo "VERIFY-OK"

      - name: Commit repair to linux
        if: steps.work.outcome == 'success'
        shell: bash
        run: |
          exec > >(tee -a /tmp/repair.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/hooks/agent/useMarkPlan.js || true
          if git diff --cached --quiet; then
            echo "NOTHING-TO-COMMIT"
          else
            git commit -m "fix(merge): perbaiki blok import useMarkPlan.js + panggilan osOpen pasca merge PR #26"
            if git push origin HEAD:linux; then
              echo "PUSHED-OK $(git rev-parse HEAD)"
            else
              echo "PUSH-FAILED"
              git format-patch -1 --stdout > /tmp/repair.patch
              head -c 20000 /tmp/repair.patch
            fi
          fi

      - name: Publish log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/repair.log ] || echo "(no log produced)" > /tmp/repair.log
          tail -c 55000 /tmp/repair.log > /tmp/repair-tail.log
          { echo '```text'; cat /tmp/repair-tail.log; echo '```'; } > /tmp/repair-comment.md
          gh pr comment 29 --repo "$GITHUB_REPOSITORY" --body-file /tmp/repair-comment.md || echo "pr comment failed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin chore/merge-repair-linux || true
          git checkout -f -B replog FETCH_HEAD || true
          mkdir -p .repair
          cp /tmp/repair-tail.log .repair/repair.log
          git add .repair/repair.log || true
          git commit -m "chore(repair): publish log [skip ci]" || true
          git push origin HEAD:chore/merge-repair-linux || echo "log push failed"
