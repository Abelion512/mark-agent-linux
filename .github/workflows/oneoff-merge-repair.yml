name: One-off merge repair (linux)

# Sekali jalan: memperbaiki sisa kerusakan resolusi konflik merge PR #26 pada
# branch linux, verifikasi (vitest + vite build), lalu push perbaikan ke linux.
# Log lengkap dipublikasikan ke .repair/repair.log di branch ini.

on:
  push:
    branches: ["chore/merge-repair-linux"]

permissions:
  contents: write

jobs:
  repair:
    name: Repair + verify linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout linux
        uses: actions/checkout@v4
        with:
          ref: linux
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Patch + verify
        id: work
        continue-on-error: true
        run: |
          set -o pipefail
          touch /tmp/repair.log
          echo "=== patch useMarkPlan.js ===" | tee -a /tmp/repair.log
          python3 - <<'PY' 2>&1 | tee -a /tmp/repair.log
          import re, pathlib

          p = pathlib.Path("src/hooks/agent/useMarkPlan.js")
          s = p.read_text(encoding="utf-8")
          orig = s
          notes = []

          broken = "} from '../../api/trajectory'\n  classifyObjectiveKind,"
          fixed = "} from '../../api/trajectory'\nimport {\n  classifyObjectiveKind,"
          if broken in s:
              s = s.replace(broken, fixed, 1)
              notes.append("FIX1 ok - objectiveVerifier import statement restored")
          else:
              notes.append("FIX1 skip - broken import pattern not found")

          uses_lr = re.search(r"\blogReasoning\s*\(", s) is not None
          bound_lr = re.search(r"import\s*\{[^}]*\blogReasoning\b[^}]*\}\s*from", s) is not None
          local_lr = re.search(r"(?:const|let|var|function)\s+logReasoning\b", s) is not None
          if uses_lr and not bound_lr and not local_lr:
              anchor = "  logSubAgentSpawn as trajectoryLogSub\n} from '../../api/trajectory'"
              repl = "  logSubAgentSpawn as trajectoryLogSub,\n  logReasoning\n} from '../../api/trajectory'"
              if anchor in s:
                  s = s.replace(anchor, repl, 1)
                  notes.append("FIX2 ok - logReasoning imported from api/trajectory")
              else:
                  notes.append("FIX2 FAIL - trajectory import anchor not found")
          else:
              notes.append("FIX2 skip - uses=%s bound=%s local=%s" % (uses_lr, bound_lr, local_lr))

          s, n3 = re.subn(r"window\.api\.os_open\(\s*\{\s*url\s*\}\s*\)", "window.api.osOpen(url)", s)
          notes.append("FIX3 os_open -> osOpen count=%d" % n3)

          if s != orig:
              p.write_text(s, encoding="utf-8")
              notes.append("useMarkPlan.js written")
          else:
              notes.append("useMarkPlan.js unchanged")
          print("\n".join(notes))
          PY
          echo "=== conflict markers ===" | tee -a /tmp/repair.log
          if git grep -I -n -E '^(<<<<<<< |>>>>>>> )' -- src src-tauri extension scripts tests evaluation >> /tmp/repair.log; then
            echo "MARKERS FOUND (listed above)" | tee -a /tmp/repair.log
          else
            echo "none" | tee -a /tmp/repair.log
          fi
          echo "=== versions ===" | tee -a /tmp/repair.log
          node -p "'package.json=' + require('./package.json').version" | tee -a /tmp/repair.log
          node -p "'tauri.conf.json=' + require('./src-tauri/tauri.conf.json').version" | tee -a /tmp/repair.log
          (grep -m1 '^version' src-tauri/Cargo.toml || true) | tee -a /tmp/repair.log
          echo "=== branch containment vs origin/linux ===" | tee -a /tmp/repair.log
          for b in $(git branch -r --format='%(refname:short)' | grep -v HEAD); do
            if git merge-base --is-ancestor "$b" origin/linux; then
              echo "contained: $b"
            else
              echo "NOT-contained: $b"
            fi
          done | tee -a /tmp/repair.log
          echo "=== bun install ===" | tee -a /tmp/repair.log
          bun install --frozen-lockfile 2>&1 | tail -n 15 | tee -a /tmp/repair.log
          echo "=== vitest ===" | tee -a /tmp/repair.log
          bunx vitest run 2>&1 | tail -n 60 | tee -a /tmp/repair.log
          echo "=== vite build ===" | tee -a /tmp/repair.log
          bun run build 2>&1 | tail -n 40 | tee -a /tmp/repair.log
          echo "=== ALL GREEN ===" | tee -a /tmp/repair.log

      - name: Push repair commit to linux
        if: steps.work.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/hooks/agent/useMarkPlan.js; then
            echo "no diff to push" | tee -a /tmp/repair.log
          else
            git add src/hooks/agent/useMarkPlan.js
            git commit -m "fix(merge): perbaiki blok import useMarkPlan.js + panggilan osOpen pasca merge PR #26"
            git push origin HEAD:linux
            echo "PUSHED $(git rev-parse HEAD) -> linux" | tee -a /tmp/repair.log
          fi

      - name: Publish log
        if: always()
        run: |
          [ -f /tmp/repair.log ] || echo "(no log produced)" > /tmp/repair.log
          cp /tmp/repair.log /tmp/repair-final.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin chore/merge-repair-linux
          git checkout -f -B replog FETCH_HEAD
          mkdir -p .repair
          cp /tmp/repair-final.log .repair/repair.log
          git add .repair/repair.log
          git commit -m "chore(repair): publish log [skip ci]" || echo "nothing to commit"
          git push origin HEAD:chore/merge-repair-linux
