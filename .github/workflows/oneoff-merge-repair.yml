name: One-off merge repair (linux)

on:
  push:
    branches: ["chore/merge-repair-linux"]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    name: Repair + verify linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout linux
        uses: actions/checkout@v4
        with:
          ref: linux
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Patch + verify
        id: work
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a /tmp/repair.log) 2>&1

          echo "### 1. install"
          bun install --frozen-lockfile 2>&1 | tail -n 2

          echo "### 2. patch useMarkPlan.js"
          python3 - <<'PY'
          import re, pathlib

          p = pathlib.Path("src/hooks/agent/useMarkPlan.js")
          s = p.read_text(encoding="utf-8")
          orig = s
          notes = []

          broken = "} from '../../api/trajectory'\n  classifyObjectiveKind,"
          fixed = "} from '../../api/trajectory'\nimport {\n  classifyObjectiveKind,"
          if broken in s:
              s = s.replace(broken, fixed, 1)
              notes.append("FIX1 ok - objectiveVerifier import statement restored")
          else:
              notes.append("FIX1 skip - pattern not found")

          uses_lr = re.search(r"\blogReasoning\s*\(", s) is not None
          bound_lr = re.search(r"import\s*\{[^}]*\blogReasoning\b[^}]*\}\s*from", s) is not None
          local_lr = re.search(r"(?:const|let|var|function)\s+logReasoning\b", s) is not None
          if uses_lr and not bound_lr and not local_lr:
              anchor = "  logSubAgentSpawn as trajectoryLogSub\n} from '../../api/trajectory'"
              repl = "  logSubAgentSpawn as trajectoryLogSub,\n  logReasoning\n} from '../../api/trajectory'"
              if anchor in s:
                  s = s.replace(anchor, repl, 1)
                  notes.append("FIX2 ok - logReasoning imported")
              else:
                  notes.append("FIX2 FAIL - anchor not found")
          else:
              notes.append("FIX2 skip - uses=%s bound=%s local=%s" % (uses_lr, bound_lr, local_lr))

          s, n3 = re.subn(r"window\.api\.os_open\(\s*\{\s*url\s*\}\s*\)", "window.api.osOpen(url)", s)
          notes.append("FIX3 os_open -> osOpen count=%d" % n3)

          if s != orig:
              p.write_text(s, encoding="utf-8")
              notes.append("useMarkPlan.js written")
          else:
              notes.append("useMarkPlan.js unchanged")
          print("\n".join(notes))
          PY

          echo "### 3. evidence: </div> dropped by PR #26 branch"
          PRHEAD=dba9e015a510e81c565932624ee16b9b034661bb
          FEAT=$(git rev-parse "$PRHEAD^1")
          LINPRE=$(git rev-parse "$PRHEAD^2")
          MB=$(git merge-base "$FEAT" "$LINPRE")
          git diff "$MB" "$FEAT" -- src/pages/Configuration.jsx | grep -n -B4 -A4 '^-.*</div>' | head -n 70 || true

          echo "### 4. fix Configuration.jsx"
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("src/pages/Configuration.jsx")
          lines = p.read_text(encoding="utf-8").split("\n")

          def scan(ls):
              stack = []
              bad = []
              for i, ln in enumerate(ls, 1):
                  t = ln.strip()
                  ind = len(ln) - len(ln.lstrip())
                  if t.startswith("<div") and not t.endswith("/>") and "</div>" not in t:
                      stack.append((ind, i))
                  elif t == "</div>":
                      if not stack:
                          bad.append(("extra", i, ind, None, None))
                          continue
                      ind0, i0 = stack.pop()
                      if ind0 != ind:
                          bad.append(("mismatch", i, ind, i0, ind0))
              return stack, bad

          stack, bad = scan(lines)
          print("before: unclosed=%s mismatches=%d" % ([i for _, i in stack], len(bad)))

          if bad and bad[0][0] == "mismatch":
              _, cl, cind, oline, oind = bad[0]
              print("first mismatch: close line %d (indent %d) popped open line %d (indent %d)" % (cl, cind, oline, oind))
              print("--- opening context %d-%d ---" % (max(1, oline - 6), min(len(lines), oline + 6)))
              for j in range(max(1, oline - 6), min(len(lines), oline + 6) + 1):
                  print("%5d| %s" % (j, lines[j - 1]))
              ins = None
              for k in range(oline, len(lines)):
                  ln = lines[k]
                  if not ln.strip():
                      continue
                  ind = len(ln) - len(ln.lstrip())
                  if ind <= oind:
                      ins = k + 1
                      break
              if ins:
                  print("--- insertion point: before line %d (indent %d) ---" % (ins, oind))
                  for j in range(max(1, ins - 12), min(len(lines), ins + 4) + 1):
                      print("%5d| %s" % (j, lines[j - 1]))
                  lines.insert(ins - 1, " " * oind + "</div>")
                  p.write_text("\n".join(lines), encoding="utf-8")
                  stack2, bad2 = scan(lines)
                  print("after: unclosed=%s mismatches=%d" % ([i for _, i in stack2], len(bad2)))
              else:
                  print("no insertion point found")
          else:
              print("no mismatch to fix")
          PY

          echo "### 5. parse sweep (esbuild)"
          cat > .parsecheck.cjs <<'NODE'
          const { transformSync } = require("esbuild")
          const fs = require("fs")
          const path = require("path")
          const roots = ["src", "scripts", "extension", "evaluation", "tests"]
          let bad = 0, n = 0
          for (const root of roots) {
            if (!fs.existsSync(root)) continue
            for (const rel of fs.readdirSync(root, { recursive: true })) {
              const p = path.join(root, rel)
              if (!/\.(js|jsx|mjs|cjs)$/.test(p)) continue
              if (!fs.statSync(p).isFile()) continue
              n++
              try {
                transformSync(fs.readFileSync(p, "utf8"), { loader: "jsx", jsx: "automatic" })
              } catch (e) {
                bad++
                const err = e && e.errors && e.errors[0]
                const loc = err && err.location ? err.location.line + ":" + err.location.column : "?"
                console.log("PARSE-FAIL", p, loc, err ? err.text : String(e).split("\n")[0])
              }
            }
          }
          console.log("parse-sweep files=" + n + " failures=" + bad)
          NODE
          node .parsecheck.cjs
          rm -f .parsecheck.cjs

          echo "### 6. vitest"
          set +e
          bunx vitest run 2>&1 | tail -n 6
          VT=${PIPESTATUS[0]}
          echo "vitest_exit=$VT"
          echo "### 7. build"
          bun run build 2>&1 | tail -n 18
          BD=${PIPESTATUS[0]}
          echo "build_exit=$BD"
          set -e
          echo "### 8. diff"
          git --no-pager diff --stat
          git --no-pager diff -U2 -- src/pages/Configuration.jsx | head -n 40
          if [ "$VT" -ne 0 ] || [ "$BD" -ne 0 ]; then
            echo "VERIFY-FAILED"
            exit 1
          fi
          echo "VERIFY-OK"

      - name: Commit repair to linux
        if: steps.work.outcome == 'success'
        shell: bash
        run: |
          exec > >(tee -a /tmp/repair.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/hooks/agent/useMarkPlan.js src/pages/Configuration.jsx || true
          if git diff --cached --quiet; then
            echo "NOTHING-TO-COMMIT"
          else
            git commit -m "fix(merge): perbaiki import useMarkPlan.js, panggilan osOpen, dan tag </div> Configuration.jsx pasca merge PR #26"
            if git push origin HEAD:linux; then
              echo "PUSHED-OK $(git rev-parse HEAD)"
            else
              echo "PUSH-FAILED"
            fi
          fi

      - name: Publish log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/repair.log ] || echo "(no log produced)" > /tmp/repair.log
          tail -c 55000 /tmp/repair.log > /tmp/repair-tail.log
          { echo '```text'; cat /tmp/repair-tail.log; echo '```'; } > /tmp/repair-comment.md
          gh pr comment 29 --repo "$GITHUB_REPOSITORY" --body-file /tmp/repair-comment.md || echo "pr comment failed"
