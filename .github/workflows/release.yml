# Release otomatis MARK Linux (fork) — dipicu tag v*, dijaga gerbang ketat.
# Alur: guard (tag==versi) -> verify (gitleaks+vitest+vite+cargo) -> publish (bundle + GitHub Release).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard — tag harus sama dengan versi tauri.conf.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Cek sinkronisasi manifest + kecocokan tag
        run: |
          bun run sync-version --check
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(bun -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          echo "tag=$TAG conf=$CONF"
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::Tag ($TAG) tidak cocok dengan src-tauri/tauri.conf.json ($CONF). Perbaiki versi atau tag."
            exit 1
          fi

  verify:
    name: Verify — secrets scan + unit test + build frontend + cargo check
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Unit tests (vitest)
        run: bunx vitest run
      - name: Frontend build (vite)
        run: bun run build
      - name: Benchmark smoke (evaluation harness)
        run: bun evaluation/smoke.mjs
      - name: Install Linux deps (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust check
        run: cargo check
        working-directory: src-tauri

  publish:
    name: Bundle AppImage/deb + GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build Tauri (AppImage + deb)
        run: bun tauri build
      - name: Kumpulkan artefak
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/ || true
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/ || true
          ls -la release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: mark-linux-${{ github.ref_name }}
          path: release-assets/*
      - name: Buat GitHub Release (+ changelog otomatis dari commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          FLAGS=""
          case "$TAG" in
            *-*) FLAGS="--prerelease" ;;   # 1.0.0-alpha.1 dst. = prerelease
          esac
          gh release create "$TAG" release-assets/* \
            --verify-tag --generate-notes $FLAGS \
            --title "MARK Linux $TAG"
